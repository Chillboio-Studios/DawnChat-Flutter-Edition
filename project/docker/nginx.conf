server {
    listen 5000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Flutter web assets are content-hashed — cache aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Never cache the entrypoint or service worker so deploys take effect.
    location ~* \.(html|js|json|webmanifest)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # SPA fallback — go_router uses path URLs, so deep links
    # (/server/x/channel/y, /invite/code, ...) must serve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
