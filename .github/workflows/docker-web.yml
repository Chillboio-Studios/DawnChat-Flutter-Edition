name: Docker Web Image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  # GHCR requires a lowercase repository path — do NOT use
  # ${{ github.repository }} here (it preserves casing).
  IMAGE_NAME: ghcr.io/chillboio-studios/dawnchat-flutter-edition

jobs:
  build:
    name: Build Docker Image
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
        exclude:
          - os: ${{ github.event_name == 'pull_request' && 'ubuntu-24.04-arm' || '' }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: project
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }}
            FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID }}
            FIREBASE_SENDER_ID=${{ secrets.FIREBASE_SENDER_ID }}
            FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}
            KLIPY_API_KEY=${{ secrets.KLIPY_API_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
