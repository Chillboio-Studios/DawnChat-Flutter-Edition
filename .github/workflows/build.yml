name: Build all platforms

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.2.3). When set, a GitHub release v<version> is created with all build artifacts."
        required: false
        type: string

env:
  FLUTTER_VERSION: "3.47.9"
  # Optional: Firebase values for FCM/APNs push (repository secrets). Empty values disable mobile push registration.
  FIREBASE_DEFINES: >-
    --dart-define=FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }}
    --dart-define=FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID }}
    --dart-define=FIREBASE_SENDER_ID=${{ secrets.FIREBASE_SENDER_ID }}
    --dart-define=FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}

defaults:
  run:
    working-directory: project

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      # cnativeapi (tray_manager) builds a native-assets hook that needs
      # GTK3/X11/Xi pkg-config packages even for pub get/test on Linux.
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libx11-dev libxi-dev libxext-dev libxfixes-dev libxrandr-dev libxrender-dev libxcursor-dev libxdamage-dev libxtst-dev libxss-dev libxcb1-dev libasound2-dev libsecret-1-dev libayatana-appindicator3-dev libcurl4-openssl-dev
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  android:
    name: Android
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The hosted runner only has ~14 GB free; building the Rust library for
      # three Android ABIs plus the Gradle/NDK outputs exhausts it. Remove
      # large preinstalled toolsets we don't use (keep /usr/local/lib/android,
      # the Android SDK).
      - name: Free disk space
        working-directory: /
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/.ghcup /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/powershell \
            /usr/share/swift /usr/local/share/boost
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -h /
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: project/rust
      # cnativeapi (tray_manager) native-assets hook needs GTK3/X11/Xi.
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libx11-dev libxi-dev libxext-dev libxfixes-dev libxrandr-dev libxrender-dev libxcursor-dev libxdamage-dev libxtst-dev libxss-dev libxcb1-dev libasound2-dev libsecret-1-dev libayatana-appindicator3-dev libcurl4-openssl-dev
      - name: Prepare release signing key
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          keystore_path="$RUNNER_TEMP/dawnchat-upload.jks"
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"
          echo "ANDROID_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
      # Unique, always-increasing build number (Unix minutes) — same scheme
      # the old Android repo used for versionCode. Maps to Android
      # versionCode and iOS/macOS CFBundleVersion via --build-number.
      - name: Set unique build number
        run: echo "BUILD_NUMBER=$(( $(date +%s) / 60 ))" >> "$GITHUB_ENV"
      # On releases, the version input becomes the app version (versionName /
      # CFBundleShortVersionString); --build-number still supplies the +N.
      - name: Set app version from release input
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        # awk is POSIX — identical on Linux, macOS, and Git-Bash Windows.
        shell: bash
        run: |
          awk -v v="${{ inputs.version }}+1" '{ if ($1 == "version:") print "version: " v; else print }' pubspec.yaml > pubspec.yaml.tmp && mv pubspec.yaml.tmp pubspec.yaml
      - run: flutter pub get
      - run: flutter build apk --release --build-number=$BUILD_NUMBER ${{ env.FIREBASE_DEFINES }}
      - run: flutter build appbundle --release --build-number=$BUILD_NUMBER ${{ env.FIREBASE_DEFINES }}
      - uses: actions/upload-artifact@v4
        with:
          name: dawnchat-android
          path: |
            project/build/app/outputs/flutter-apk/app-release.apk
            project/build/app/outputs/bundle/release/app-release.aab

  play-store:
    name: Google Play
    if: github.event_name == 'workflow_dispatch' && inputs.version != ''
    needs: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dawnchat-android
          path: artifacts/android
      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.chillboiostudios.dawnchat
          releaseFiles: artifacts/android/bundle/release/app-release.aab
          track: internal

  ios:
    name: iOS
    needs: analyze
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: project/rust
      - name: Set unique build number
        run: echo "BUILD_NUMBER=$(( $(date +%s) / 60 ))" >> "$GITHUB_ENV"
      # On releases, the version input becomes the app version (versionName /
      # CFBundleShortVersionString); --build-number still supplies the +N.
      - name: Set app version from release input
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        # awk is POSIX — identical on Linux, macOS, and Git-Bash Windows.
        shell: bash
        run: |
          awk -v v="${{ inputs.version }}+1" '{ if ($1 == "version:") print "version: " v; else print }' pubspec.yaml > pubspec.yaml.tmp && mv pubspec.yaml.tmp pubspec.yaml
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign --build-number=$BUILD_NUMBER ${{ env.FIREBASE_DEFINES }}
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry dawnchat-ios-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: dawnchat-ios
          path: project/dawnchat-ios-unsigned.ipa
      # --- Release only: signed IPA uploaded to App Store Connect ---
      - name: Import signing certificate
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/asc.keychain-db
          KEYCHAIN_PASSWORD=$(uuidgen)
          CERT_FILE=$RUNNER_TEMP/cert.p12
          echo "$MACOS_CERTIFICATE_BASE64" | base64 --decode > "$CERT_FILE"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_FILE" -P "$MACOS_CERTIFICATE_PWD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
      - name: App Store Connect API key
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        env:
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
          if echo "$APPLE_API_PRIVATE_KEY" | grep -q "BEGIN PRIVATE KEY"; then
            echo "$APPLE_API_PRIVATE_KEY" > "$KEY_PATH"
          else
            echo "$APPLE_API_PRIVATE_KEY" | base64 --decode > "$KEY_PATH"
          fi
      - name: Build signed IPA and upload to App Store Connect
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          sed -i '' "s/\$(APPLE_TEAM_ID)/$APPLE_TEAM_ID/" ios/ExportOptions.plist
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
          # flutter build ipa cannot pass provisioning auth to xcodebuild, so
          # archive + export manually with the App Store Connect API key.
          # Archive unsigned: automatic signing would try to create a
          # *development* profile, which requires registered devices. The
          # export step re-signs for App Store (no devices needed).
          (cd ios && xcodebuild -workspace Runner.xcworkspace -scheme Runner \
            -configuration Release -sdk iphoneos \
            -archivePath ../build/ios/Runner.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$APPLE_API_KEY_ID" \
            -authenticationKeyIssuerID "$APPLE_API_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID")
          xcodebuild -exportArchive \
            -archivePath build/ios/Runner.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist ios/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$APPLE_API_KEY_ID" \
            -authenticationKeyIssuerID "$APPLE_API_ISSUER_ID"
          # ExportOptions.plist has destination=upload, so -exportArchive
          # already delivered the IPA to App Store Connect — nothing left
          # to upload manually.

  macos:
    name: macOS
    needs: analyze
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: project/rust
      - name: Set unique build number
        run: echo "BUILD_NUMBER=$(( $(date +%s) / 60 ))" >> "$GITHUB_ENV"
      # On releases, the version input becomes the app version (versionName /
      # CFBundleShortVersionString); --build-number still supplies the +N.
      - name: Set app version from release input
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        # awk is POSIX — identical on Linux, macOS, and Git-Bash Windows.
        shell: bash
        run: |
          awk -v v="${{ inputs.version }}+1" '{ if ($1 == "version:") print "version: " v; else print }' pubspec.yaml > pubspec.yaml.tmp && mv pubspec.yaml.tmp pubspec.yaml
      - run: flutter config --enable-macos-desktop
      - run: flutter pub get
      - run: flutter build macos --release --build-number=$BUILD_NUMBER ${{ env.FIREBASE_DEFINES }}
      - name: Package app
        run: ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/DawnChat.app dawnchat-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: dawnchat-macos
          path: project/dawnchat-macos.zip
      # --- Release only: signed .pkg uploaded to App Store Connect ---
      - name: Import signing certificate and provisioning profile
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          MACOS_INSTALLER_CERTIFICATE_BASE64: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_BASE64 }}
          MACOS_INSTALLER_CERTIFICATE_PWD: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_PWD }}
          MACOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.MACOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain-db
          KEYCHAIN_PASSWORD=$(uuidgen)
          CERT_FILE=$RUNNER_TEMP/cert.p12
          PROFILE_FILE=$RUNNER_TEMP/profile.provisionprofile
          echo "$MACOS_CERTIFICATE_BASE64" | base64 --decode > "$CERT_FILE"
          echo "$MACOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_FILE"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_FILE" -P "$MACOS_CERTIFICATE_PWD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          # Optional: a separate installer certificate (e.g. "Developer ID
          # Installer" or "3rd Party Mac Developer Installer") for productbuild.
          if [ -n "$MACOS_INSTALLER_CERTIFICATE_BASE64" ]; then
            INSTALLER_FILE=$RUNNER_TEMP/installer.p12
            echo "$MACOS_INSTALLER_CERTIFICATE_BASE64" | base64 --decode > "$INSTALLER_FILE"
            security import "$INSTALLER_FILE" -P "$MACOS_INSTALLER_CERTIFICATE_PWD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          fi
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< "$(security cms -D -i "$PROFILE_FILE")" 2>/dev/null || echo "")
          cp "$PROFILE_FILE" ~/Library/MobileDevice/Provisioning\ Profiles/
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "APP_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -i "Apple Distribution" | head -1 | sed 's/.*"\(.*\)"/\1/')" >> "$GITHUB_ENV"
          # Installer certs don't satisfy the codesigning policy, so look them
          # up without -p codesigning.
          echo "INSTALLER_IDENTITY=$(security find-identity -v "$KEYCHAIN_PATH" | grep -i "installer" | head -1 | sed 's/.*"\(.*\)"/\1/')" >> "$GITHUB_ENV"
      - name: App Store Connect API key
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        env:
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
          if echo "$APPLE_API_PRIVATE_KEY" | grep -q "BEGIN PRIVATE KEY"; then
            echo "$APPLE_API_PRIVATE_KEY" > "$KEY_PATH"
          else
            echo "$APPLE_API_PRIVATE_KEY" | base64 --decode > "$KEY_PATH"
          fi
      - name: Sign, package, and upload macOS app to App Store Connect
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          APP_PATH="build/macos/Build/Products/Release/DawnChat.app"
          # Mac App Store uploads require an embedded provisioning profile.
          cp "$RUNNER_TEMP/profile.provisionprofile" "$APP_PATH/Contents/embedded.provisionprofile"
          # Re-sign for App Store distribution. Sign nested code first
          # (dylibs, then bundles), then the app itself WITH entitlements —
          # a bare --deep re-sign drops com.apple.security.app-sandbox and
          # friends, which App Store validation rejects.
          sign_item() {
            codesign --force --options runtime --timestamp --sign "$APP_IDENTITY" "$1"
          }
          find "$APP_PATH/Contents" -name "*.dylib" -print0 |
            while IFS= read -r -d '' f; do sign_item "$f"; done
          find "$APP_PATH/Contents" \( -name "*.framework" -o -name "*.appex" -o -name "*.xpc" \) -print0 |
            while IFS= read -r -d '' item; do sign_item "$item"; done
          codesign --force --options runtime --timestamp \
            --entitlements macos/Runner/Release.entitlements \
            --sign "$APP_IDENTITY" "$APP_PATH"
          mkdir -p out/make
          PKG_PATH="out/make/DawnChat.pkg"
          # productbuild requires an installer signing identity, which is a
          # different certificate type than the app-signing identity.
          if [ -z "$INSTALLER_IDENTITY" ]; then
            echo "::error::No installer signing identity found. Add an installer certificate (e.g. 'Developer ID Installer' or '3rd Party Mac Developer Installer') to MACOS_INSTALLER_CERTIFICATE_BASE64/MACOS_INSTALLER_CERTIFICATE_PWD, or include it in MACOS_CERTIFICATE_BASE64."
            exit 1
          fi
          productbuild \
            --component "$APP_PATH" /Applications \
            --sign "$INSTALLER_IDENTITY" \
            "$PKG_PATH"
          xcrun altool --upload-app \
            -f "$PKG_PATH" \
            -t macos \
            --apiKey "$APPLE_API_KEY_ID" \
            --apiIssuer "$APPLE_API_ISSUER_ID"

  windows:
    name: Windows
    needs: analyze
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: project/rust
      - name: Set unique build number
        run: echo "BUILD_NUMBER=$(( $(date +%s) / 60 ))" >> "$GITHUB_ENV"
      # On releases, the version input becomes the app version (versionName /
      # CFBundleShortVersionString); --build-number still supplies the +N.
      - name: Set app version from release input
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        # awk is POSIX — identical on Linux, macOS, and Git-Bash Windows.
        shell: bash
        run: |
          awk -v v="${{ inputs.version }}+1" '{ if ($1 == "version:") print "version: " v; else print }' pubspec.yaml > pubspec.yaml.tmp && mv pubspec.yaml.tmp pubspec.yaml
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter build windows --release --build-number=$BUILD_NUMBER
        shell: bash
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath dawnchat-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: dawnchat-windows
          path: project/dawnchat-windows.zip

  linux:
    name: Linux
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libx11-dev libxi-dev libxext-dev libxfixes-dev libxrandr-dev libxrender-dev libxcursor-dev libxdamage-dev libxtst-dev libxss-dev libxcb1-dev liblzma-dev libstdc++-12-dev libasound2-dev libsecret-1-dev libayatana-appindicator3-dev libmpv-dev mpv libcurl4-openssl-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: project/rust
      - name: Set unique build number
        run: echo "BUILD_NUMBER=$(( $(date +%s) / 60 ))" >> "$GITHUB_ENV"
      # On releases, the version input becomes the app version (versionName /
      # CFBundleShortVersionString); --build-number still supplies the +N.
      - name: Set app version from release input
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        # awk is POSIX — identical on Linux, macOS, and Git-Bash Windows.
        shell: bash
        run: |
          awk -v v="${{ inputs.version }}+1" '{ if ($1 == "version:") print "version: " v; else print }' pubspec.yaml > pubspec.yaml.tmp && mv pubspec.yaml.tmp pubspec.yaml
      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
      - run: flutter build linux --release --build-number=$BUILD_NUMBER
      - name: Package
        run: tar -C build/linux/x64/release/bundle -czf dawnchat-linux.tar.gz .
      - name: Package AppImage
        run: |
          mkdir -p AppDir
          cp -r build/linux/x64/release/bundle/* AppDir/
          cp assets/branding/android-chrome-512x512.png AppDir/dawnchat.png
          cat > AppDir/dawnchat.desktop <<'EOF'
          [Desktop Entry]
          Name=DawnChat
          Exec=DawnChat
          Icon=dawnchat
          Type=Application
          Categories=Network;InstantMessaging;
          Comment=A User-First chat application
          EOF
          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/DawnChat" "$@"
          EOF
          chmod +x AppDir/AppRun
          curl -sL -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir DawnChat-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: dawnchat-linux
          path: |
            project/dawnchat-linux.tar.gz
            project/DawnChat-x86_64.AppImage

  web:
    name: Web
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      # cnativeapi (tray_manager) native-assets hook needs GTK3/X11/Xi.
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libx11-dev libxi-dev libxext-dev libxfixes-dev libxrandr-dev libxrender-dev libxcursor-dev libxdamage-dev libxtst-dev libxss-dev libxcb1-dev libasound2-dev libsecret-1-dev libayatana-appindicator3-dev libcurl4-openssl-dev
      - name: Set unique build number
        run: echo "BUILD_NUMBER=$(( $(date +%s) / 60 ))" >> "$GITHUB_ENV"
      # On releases, the version input becomes the app version (versionName /
      # CFBundleShortVersionString); --build-number still supplies the +N.
      - name: Set app version from release input
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        # awk is POSIX — identical on Linux, macOS, and Git-Bash Windows.
        shell: bash
        run: |
          awk -v v="${{ inputs.version }}+1" '{ if ($1 == "version:") print "version: " v; else print }' pubspec.yaml > pubspec.yaml.tmp && mv pubspec.yaml.tmp pubspec.yaml
      - run: flutter pub get
      # Our own service worker (web/push_sw.js) handles push, so Flutter's caching worker is disabled.
      - run: flutter build web --release --build-number=$BUILD_NUMBER --pwa-strategy=none --no-wasm-dry-run
      - name: Add SPA fallback for deep links
        run: cp build/web/index.html build/web/404.html
      - uses: actions/upload-artifact@v4
        with:
          name: dawnchat-web
          path: project/build/web

  release:
    name: Release
    if: github.event_name == 'workflow_dispatch' && inputs.version != ''
    needs: [android, ios, macos, windows, linux, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect release assets
        working-directory: .
        run: |
          mkdir -p release-assets
          cp artifacts/dawnchat-android/flutter-apk/app-release.apk release-assets/dawnchat-android.apk
          cp artifacts/dawnchat-android/bundle/release/app-release.aab release-assets/dawnchat-android.aab
          cp artifacts/dawnchat-ios/dawnchat-ios-unsigned.ipa release-assets/ 2>/dev/null || cp artifacts/dawnchat-ios/* release-assets/
          cp artifacts/dawnchat-macos/dawnchat-macos.zip release-assets/
          cp artifacts/dawnchat-windows/dawnchat-windows.zip release-assets/
          cp artifacts/dawnchat-linux/dawnchat-linux.tar.gz release-assets/
          cp artifacts/dawnchat-linux/DawnChat-x86_64.AppImage release-assets/
          (cd artifacts/dawnchat-web && zip -qry ../../release-assets/dawnchat-web.zip .)
          ls -la release-assets
      - name: Create GitHub release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ inputs.version }}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "DawnChat v${{ inputs.version }}" \
            --generate-notes \
            release-assets/*
