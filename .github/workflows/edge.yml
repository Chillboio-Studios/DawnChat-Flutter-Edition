name: Bleeding Edge

# Every push to bleeding: builds all platforms, pushes the web
# Docker image tagged edge-<run>, and publishes a prerelease GitHub release.
# Never uploads to the App Store or Google Play.
on:
  push:
    branches: [bleeding]

jobs:
  build:
    uses: ./.github/workflows/_build.yml
    secrets: inherit
    with:
      edge: true
