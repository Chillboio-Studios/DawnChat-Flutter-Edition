name: Bug report
description: Report something that isn't working correctly
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill out the sections below.
  - type: input
    id: platform
    attributes:
      label: Platform
      description: Where does this happen?
      placeholder: e.g. Android 14, Windows 11, Web (Chrome), iOS 17, macOS 14, Linux
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: App version or commit SHA (visible in Settings → About)
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, and what went wrong?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Relevant console output, crash logs, or screenshots. Remove tokens and personal info first.
      render: shell
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this isn't a duplicate
          required: true
        - label: I can reproduce this consistently (or noted it's intermittent)
          required: true
