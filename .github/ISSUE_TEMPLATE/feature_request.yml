name: Feature request
description: Suggest an idea or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem you're trying to solve, not just the solution — it helps us evaluate the idea.
  - type: textarea
    id: problem
    attributes:
      label: Problem / use case
      description: What are you trying to do that DawnChat doesn't support well today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like it to work?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Messaging
        - Servers / channels
        - Voice / video
        - Profile / presence
        - Settings / customization
        - Admin / moderation
        - Mobile app
        - Desktop app
        - Web app
        - API / bots
        - Other
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this isn't a duplicate
          required: true
        - label: I'm open to alternative approaches if mine isn't the best fit
          required: false
